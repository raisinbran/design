name: Temporary Portfolio Studio formatter

on:
  push:
    branches:
      - feat/new-henrico-app-and-site-hotfixes
    paths:
      - "portfolio-studio/**"
      - ".github/workflows/temporary-portfolio-formatter.yml"

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style(photos): normalize')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/new-henrico-app-and-site-hotfixes
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portfolio-studio/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: portfolio-studio
      - name: Format application source
        run: npm run format
        working-directory: portfolio-studio
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet -- portfolio-studio; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add portfolio-studio
            git commit -m "style(photos): normalize output-format and gallery tests"
            git push origin HEAD:feat/new-henrico-app-and-site-hotfixes
          fi
